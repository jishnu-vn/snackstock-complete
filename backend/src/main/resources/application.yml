spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/snackstock;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
server:
  port: ${PORT:8080}
app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  admin-id: ${ADMIN_ID:admin}
  admin-password: ${ADMIN_PASSWORD:snackstock123}
  upload-dir: ${UPLOAD_DIR:uploads}
